# render.yaml — Render Blueprint (Infrastructure as Code)
# Connect your GitHub repo → New → Blueprint → Render reads this file

databases:
  - name: coldguard-db
    plan: free
    databaseName: coldguard
    user: coldguard

services:
  # ── Backend (FastAPI) ───────────────────────────────────────────────
  - type: web
    name: coldguard-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coldguard-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        value: ""
      - key: RUN_SIMULATOR
        value: "true"

  # ── Frontend (Vite Static Site) ─────────────────────────────────────
  - type: web
    name: coldguard-ui
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    plan: free
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://coldguard-api.onrender.com
